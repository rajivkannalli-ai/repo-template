[project]
name = "REPLACE_ME"
version = "0.1.0"
description = "REPLACE_ME"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.8",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=src --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Rename this alongside [project].name — hatchling can't infer the package
# from "REPLACE_ME" and `uv sync` fails without an explicit path.
packages = ["src/REPLACE_ME"]
